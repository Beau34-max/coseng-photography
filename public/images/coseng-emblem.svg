<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <g id="blade">
      <!-- Each blade: inner arc (r=7) swept ±20° around 0°, outer arc (r=16) at +10°→+50°, offset creates the interlaced iris look -->
      <path d="M 26.58 17.61 A 7 7 0 0 1 26.58 22.39 L 30.28 32.26 A 16 16 0 0 0 35.76 22.78 Z" fill="#E8C878"/>
    </g>
  </defs>

  <!-- Dark background circle -->
  <circle cx="20" cy="20" r="20" fill="#1E1B18"/>

  <!-- Six aperture blades, each rotated 60° -->
  <use href="#blade"/>
  <use href="#blade" transform="rotate(60 20 20)"/>
  <use href="#blade" transform="rotate(120 20 20)"/>
  <use href="#blade" transform="rotate(180 20 20)"/>
  <use href="#blade" transform="rotate(240 20 20)"/>
  <use href="#blade" transform="rotate(300 20 20)"/>

  <!-- Outer ring -->
  <circle cx="20" cy="20" r="18" fill="none" stroke="#E8C878" stroke-width="0.8"/>

  <!-- Centre aperture opening -->
  <circle cx="20" cy="20" r="5.5" fill="#1E1B18"/>
  <circle cx="20" cy="20" r="5.5" fill="none" stroke="#E8C878" stroke-width="0.6"/>
</svg>
